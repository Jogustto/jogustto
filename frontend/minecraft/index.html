<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>João Augustto - Minecraft</title>

    <link rel="stylesheet" href="frontend/css/style.css" />
    <script src="frontend/js/script.js" defer></script>
  </head>
  <body>
    <header class="header">
      <a href="#home" class="logo">João Augustto</a>

      <nav class="navbar" aria-label="Navegação Principal">
        <a href="#home" data-i18n="nav.home">Home</a>
        <a href="#about" data-i18n="nav.about">About me</a>
        <a href="#minecraft" data-i18n="nav.minecraft">Minecraft</a>
      </nav>

      <div class="lang-switch" role="group" aria-label="Seletor de Idioma">
        <button id="btn-pt" class="lang-btn active">PT</button>
        <span aria-hidden="true">|</span>
        <button id="btn-en" class="lang-btn">EN</button>
      </div>
    </header>
    <main class="mc-main">
      <section class="status-container">
        <h1 data-i18n="mc.title">Servidor Forge 1.20.1</h1>
        <div class="status-badge-wrapper">
          <span id="server-status" class="status-badge status-checking">
            <span class="status-dot"></span>
            <span id="status-text" data-i18n="mc.status.checking"
              >Verificando Servidor...</span
            >
          </span>
        </div>
      </section>
      <section class="character-select-container" aria-label="Links Rápidos">
        <ul class="character-select-grid">
          
          <li class="char-card card-mods">
              <a href="https://drive.google.com/file/d/1ysGxLDuQ0RewMyDQ7elmnnEAFKAVuKYN/view?usp=drive_link" target="_blank" rel="noopener noreferrer" class="char-card-link">
              <div class="char-bg-image"></div>
              <div class="char-card-content">
                <h2 data-i18n="mc.cards.mods.title">Mods</h2>
                <p data-i18n="mc.cards.mods.desc">Baixar pacote de mods (.zip)</p>
              </div>
            </a>
          </li>

          <li class="char-card card-discord">
            <a href="https://discord.gg/3QjJR6EBA" target="_blank" rel="noopener noreferrer" class="char-card-link">
              <div class="char-bg-image"></div>
              <div class="char-card-content">
                <h2 data-i18n="mc.cards.discord.title">Discord</h2>
                <p data-i18n="mc.cards.discord.desc">Comunidade e avisos do servidor</p>
              </div>
            </a>
          </li>
        </ul>
      </section>
    </main>

    <footer class="footer">
      <p data-i18n="footer.copyright">
        &copy; 2026 João Augustto. Todos os direitos reservados.
      </p>
    </footer>
  </body>
</html>
